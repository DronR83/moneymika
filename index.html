<style>
:root{
  --ink:#0b0d12; --panel:#12151c; --panel2:#181c25; --line:#252b37; --line-soft:#1b202b;
  --txt:#eef1f6; --sub:#828a9a;
  --brass:#c9a34c; --brass-light:#f2d38a; --brass-dark:#8f6d24;
  --green:#3ddc84; --red:#ff6b6b;
  --serif: Georgia,'Iowan Old Style','Palatino Linotype',serif;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font-family:var(--sans);overscroll-behavior:none;}
body{background-image:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,163,76,.08), transparent 60%);}
#shell{min-height:100vh;display:flex;justify-content:center;align-items:stretch;gap:48px;}
#app{width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--ink);overflow:hidden;}
#brandSide{display:none;}
@media (min-width:600px) and (max-width:719px){
  #app{max-width:540px;}
}
@media (min-width:720px) and (hover:hover) and (pointer:fine){
  body{background:radial-gradient(ellipse 1400px 900px at 50% 0%, rgba(201,163,76,.12), transparent 60%),var(--ink);}
  #shell{padding:40px 0;align-items:center;justify-content:center;}
  #app{max-width:600px;height:92vh;height:92dvh;max-height:960px;border-radius:32px;border:1px solid var(--line);box-shadow:0 50px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(201,163,76,.08);overflow:hidden;}
  h2.pagehead{font-size:clamp(28px,3vw,34px)!important;}
  .card .val{font-size:clamp(24px,2.2vw,28px)!important;}
  .rec-title{font-size:17.5px!important;}
  button.btn{transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;}
}
/* Tout appareil tactile large (pliable ouvert, tablette) : plein écran, textes agrandis */
@media (min-width:600px) and (pointer:coarse){
  #shell{padding:0!important;gap:0!important;}
  #brandSide{display:none!important;}
  #app{max-width:100%!important;width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0!important;border:none!important;box-shadow:none!important;}
  #content{padding:24px 22px 130px;}
  h2.pagehead{font-size:32px;}
  .card .val{font-size:28px;}
  .card .lbl{font-size:14px;}
  .rec-title{font-size:19px;}
  .rec-sub{font-size:15px;}
  .small{font-size:15px;}
  button.btn{font-size:18px;padding:17px;}
  input,select{font-size:18px;padding:16px 17px;}
  #nav button{font-size:13px;}
  #nav .ic{font-size:26px;}
}
@media (min-width:900px) and (pointer:coarse){
  .cards{grid-template-columns:1fr 1fr 1fr 1fr;}
}
@media (min-width:1100px) and (hover:hover) and (pointer:fine){
  #brandSide{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:280px;flex-shrink:0;
    animation:fadeInUp .6s ease both;}
  #brandSide img{width:96px;height:96px;border-radius:26px;box-shadow:0 20px 50px rgba(201,163,76,.25), 0 0 0 1px rgba(201,163,76,.15);
    animation:brandFloat 4.5s ease-in-out infinite;}
  #brandSide .bname{font-family:var(--serif);font-size:30px;color:var(--txt);letter-spacing:.5px;}
  #brandSide .btag{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--sub);}
  #brandSide .bline{width:40px;height:2px;background:var(--brass);border-radius:2px;opacity:.6;}
}
@keyframes brandFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@media (hover:hover){
  .card.clickable:hover{transform:translateY(-2px);border-color:rgba(201,163,76,.4);}
  .rec-card:hover{border-color:rgba(201,163,76,.3);}
  button.btn:hover{filter:brightness(1.08);}
  .list-item:hover{background:rgba(201,163,76,.05);}
}
.rec-icon{animation:iconPop .35s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes iconPop{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
/* Écran couvercle de pliable / petit téléphone : compact */
@media (max-width:400px){
  #content{padding-left:12px;padding-right:12px;}
  .cards{grid-template-columns:1fr 1fr;}
  .rec-icon{width:40px;height:40px;font-size:19px;}
  .rec-card{padding:12px;gap:10px;}
  .rec-title{font-size:15.5px;}
  .rec-sub{font-size:13px;}
  .card .val{font-size:19px;}
}
@media (max-width:330px){
  .cards{grid-template-columns:1fr;}
  h2.pagehead{font-size:21px;}
  #fab{width:52px;height:52px;font-size:24px;right:14px;}
  .rec-icon{width:34px;height:34px;font-size:16px;}
}
#content{flex:1;padding:20px 18px 140px;overflow-y:auto;}
h2.pagehead{font-family:var(--serif);font-size:clamp(27px,6vw,32px);font-weight:400;letter-spacing:.3px;margin:2px 0 18px;color:var(--txt);}
h3.blocktitle{font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--sub);margin:0 0 14px;}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 6px;}
.month-nav .m-label{font-family:var(--serif);font-size:16px;text-transform:capitalize;flex:1;text-align:center;}
.month-nav button{background:var(--panel2);border:1px solid var(--line);color:var(--brass-light);width:40px;height:40px;border-radius:12px;font-size:18px;transition:transform .1s ease, background .15s ease;}
.month-nav button:active{transform:scale(.88);background:var(--line);}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;animation:fadeInUp .35s ease both;}
.card{background:linear-gradient(160deg, var(--panel2), var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;transition:transform .15s ease, border-color .15s ease;}
.card.clickable:active{border-color:rgba(201,163,76,.35);}
.card::before{content:'';position:absolute;top:-40%;right:-30%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle, rgba(201,163,76,.10), transparent 70%);}
.card.clickable{cursor:pointer;}
.card.clickable:active{transform:scale(.96);}
.card .lbl{font-size:13px;color:var(--sub);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px;}
.card .val{font-family:var(--serif);font-size:clamp(23px,6.5vw,27px);font-weight:400;}
.pos{color:var(--green);} .neg{color:var(--red);}
.accent{color:var(--brass-light);}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px rgba(0,0,0,.18);animation:fadeInUp .4s ease both;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:15px 16px;border-radius:12px;font-size:17px;width:100%;font-family:var(--sans);transition:border-color .15s ease, box-shadow .15s ease;}
input:focus,select:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(201,163,76,.15);}
.row{display:flex;gap:8px;margin-bottom:10px;}
.row > *{flex:1;}
.small{font-size:14px;color:var(--sub);}
button.btn{cursor:pointer;font-weight:600;font-size:16.5px;width:100%;border:none;border-radius:14px;padding:15px;color:var(--txt);background:var(--panel2);border:1px solid var(--line);transform:translateY(0);box-shadow:0 3px 0 rgba(0,0,0,.35), 0 8px 16px rgba(0,0,0,.15);transition:transform .08s ease, box-shadow .08s ease, background .15s ease;}
button.btn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.15);}
button.btn.primary{background:linear-gradient(160deg, var(--brass-light), var(--brass) 55%, var(--brass-dark));color:#1a1305;border:none;box-shadow:0 3px 0 rgba(90,65,10,.6), 0 10px 22px rgba(201,163,76,.25);}
button.btn.primary:active{box-shadow:0 0 0 rgba(90,65,10,.6), 0 3px 8px rgba(201,163,76,.18);}
button.btn.danger{width:auto;padding:8px 14px;font-size:12px;background:rgba(255,107,107,.1);color:var(--red);border:1px solid rgba(255,107,107,.25);box-shadow:none;}
button.btn.danger:active{transform:scale(.94);}
button.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;}
#fab{position:absolute;right:18px;bottom:108px;width:58px;height:58px;border-radius:50%;background:linear-gradient(160deg, var(--brass-light), var(--brass) 55%, var(--brass-dark));border:none;color:#1a1305;font-size:27px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(90,65,10,.6), 0 12px 26px rgba(201,163,76,.3);transition:transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s ease;z-index:40;line-height:0;animation:fabBreathe 3.2s ease-in-out infinite;}
@keyframes fabBreathe{0%,100%{box-shadow:0 4px 0 rgba(90,65,10,.6), 0 12px 26px rgba(201,163,76,.3);}50%{box-shadow:0 4px 0 rgba(90,65,10,.6), 0 12px 30px rgba(201,163,76,.5);}}
#fab:active{transform:translateY(4px) scale(.92) rotate(90deg);box-shadow:0 0 0 rgba(90,65,10,.6), 0 4px 10px rgba(201,163,76,.25);animation:none;}
#quickOverlay{position:fixed;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:80;}
#quickOverlay.open{display:flex;}
#quickSheet{width:100%;max-width:480px;background:var(--panel);border-radius:24px 24px 0 0;padding:22px 18px 28px;border:1px solid var(--line);border-bottom:none;animation:slideUp .22s cubic-bezier(.2,.8,.3,1);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
#quickSheet .handle{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 16px;}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin-bottom:10px;}
.seg button{flex:1;background:none;border:none;color:var(--sub);padding:10px;border-radius:9px;font-weight:600;font-size:13px;transition:all .15s ease;box-shadow:none;}
.seg button.active{background:var(--brass);color:#1a1305;}
.seg button.active.out{background:rgba(255,107,107,.15);color:var(--red);}
.seg button.active.in{background:rgba(61,220,132,.15);color:var(--green);}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line-soft);border-radius:10px;transition:background .15s ease;margin:0 -4px;}

.rec-card{display:flex;gap:14px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:11px;}
.rec-icon{width:52px;height:52px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.rec-icon.out{background:transparent;}
.rec-icon.in{background:transparent;}
.rec-body{flex:1;min-width:0;}
.rec-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.rec-sub{font-size:14.5px;color:var(--sub);margin-top:3px;}
.rec-dates{font-size:13px;color:var(--sub);margin-top:6px;display:flex;align-items:center;gap:5px;opacity:.85;}
.rec-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.rec-actions{display:flex;gap:6px;}
.rec-actions button{width:30px;height:30px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--sub);font-size:13px;box-shadow:none;padding:0;}
.rec-actions button:active{transform:scale(.9);}
.rec-actions button.danger{color:var(--red);background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.25);}
.list-item:active{background:rgba(201,163,76,.06);}
.list-item:last-child{border-bottom:none;}
.item-main{font-size:17px;font-weight:500;}
.item-sub{font-size:13.5px;color:var(--sub);margin-top:2px;}
.dot-bar{background:var(--line-soft);border-radius:6px;width:70px;height:6px;overflow:hidden;}
.dot-fill{height:6px;border-radius:6px;transition:width .3s ease;}
.check{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s ease;cursor:pointer;}
.check.on{background:var(--brass);border-color:var(--brass);}
.check.on::after{content:'✓';color:#1a1305;font-size:14px;font-weight:700;}
#nav{display:flex;background:rgba(18,21,28,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);position:sticky;bottom:0;width:100%;padding:8px 4px 10px;z-index:30;}
#nav button{flex:1;background:none;border:none;color:var(--sub);padding:9px 2px 4px;font-size:11.5px;font-weight:500;border-radius:12px;transition:color .2s ease, transform .1s ease;position:relative;box-shadow:none;}
#nav button:active{transform:scale(.9);}
#nav button.active{color:var(--brass-light);text-shadow:0 0 12px rgba(201,163,76,.4);}
#nav button.active::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--brass-light);}
#nav .ic{font-size:23px;display:block;margin-bottom:3px;filter:grayscale(1) opacity(.7);}
#nav button.active .ic{filter:none;transform:scale(1.08);}
#lock{position:fixed;inset:0;background:radial-gradient(ellipse 700px 500px at 50% 20%, rgba(201,163,76,.1), var(--ink) 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;padding:24px;}
#lockBrand{display:flex;flex-direction:column;align-items:center;margin-bottom:26px;}
#lockIcon{width:64px;height:64px;border-radius:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(201,163,76,.18), 0 0 0 1px rgba(201,163,76,.2);}
#lockBrand .name{font-family:var(--serif);font-size:22px;letter-spacing:.5px;}
#lockBrand .sub{font-size:11px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
#lockMsg{color:var(--red);font-size:12px;min-height:16px;margin-bottom:6px;text-align:center;max-width:280px;}
#lockForm{width:100%;max-width:280px;}
#lockForm .small{text-align:center;margin-top:12px;}
#loginBtn{margin-top:6px;}
#lockSpinner{display:none;text-align:center;color:var(--sub);font-size:12px;margin-top:10px;}
#dropzone{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--sub);font-size:13px;}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }
</style>
</head>

<script>
/* =====================================================================
   CONFIGURATION FIREBASE — À REMPLIR
   Remplace les valeurs ci-dessous par celles de TON projet Firebase.
   Console Firebase > Paramètres du projet > tes applications > Config SDK
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyChQMyMTU57gy-gHfSYAqAxoZL1uzzi4jE",
  authDomain: "money-mika.firebaseapp.com",
  projectId: "money-mika",

  messagingSenderId: "396790183836",

};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* =====================================================================
   CHIFFREMENT — tes données sont chiffrées AVANT d'être envoyées.
   Firebase ne stocke que du texte illisible. Seul ton mot de passe
   permet de déchiffrer (il n'est jamais envoyé nulle part).
===================================================================== */
async function deriveKey(password, saltB64){
  const enc = new TextEncoder();
  const salt = saltB64 ? base64ToBuf(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
  return {key, salt};
}
async function encryptData(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder().encode(JSON.stringify(obj));
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc);
  return { iv: bufToBase64(iv), data: bufToBase64(cipher) };
}
async function decryptData(key, ivB64, dataB64){
  const iv = base64ToBuf(ivB64);
  const cipher = base64ToBuf(dataB64);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipher);
  return JSON.parse(new TextDecoder().decode(plain));
}
function bufToBase64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function base64ToBuf(b64){ return Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); }

let currentUid=null, currentKey=null, currentSaltB64=null;
let saveTimer=null;

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const msg=document.getElementById('lockMsg');
  const spinner=document.getElementById('lockSpinner');
  msg.textContent="";
  if(!email || password.length<6){ msg.textContent="Email valide + mot de passe 6 caractères min."; return; }
  document.getElementById('lockForm').style.display='none';
  spinner.style.display='block';
  try{
    let cred;
    try{
      cred = await auth.signInWithEmailAndPassword(email, password);
    }catch(err){
      if(err.code==='auth/user-not-found' || err.code==='auth/invalid-credential'){
        try{
          cred = await auth.createUserWithEmailAndPassword(email, password);
        }catch(err2){
          if(err2.code==='auth/email-already-in-use'){
            throw new Error("Mot de passe incorrect.");
          } else if(err2.code==='auth/weak-password'){
            throw new Error("Mot de passe trop faible (6 caractères min).");
          } else { throw err2; }
        }
      } else if(err.code==='auth/wrong-password'){
        throw new Error("Mot de passe incorrect.");
      } else if(err.code==='auth/invalid-email'){
        throw new Error("Email invalide.");
      } else { throw err; }
    }
    currentUid = cred.user.uid;
    const docRef = db.collection('users').doc(currentUid);
    const docSnap = await docRef.get();
    if(docSnap.exists && docSnap.data().data){
      const d = docSnap.data();
      const {key} = await deriveKey(password, d.salt);
      currentKey = key; currentSaltB64 = d.salt;
      DATA = await decryptData(key, d.iv, d.data);
      if(!DATA.cardDefer) DATA.cardDefer={};
      if(!DATA.cardExtras) DATA.cardExtras={};
      if(!DATA.cardManualTotal) DATA.cardManualTotal={};
      if(!DATA.recurringOverrides) DATA.recurringOverrides={};
      if(!DATA.categoryIcons) DATA.categoryIcons={};
      if(!DATA.cardExtraValidated) DATA.cardExtraValidated={};
      if(!DATA.nextCardExtraId) DATA.nextCardExtraId=1;
    } else {
      const {key, salt} = await deriveKey(password);
      currentKey = key; currentSaltB64 = bufToBase64(salt);
      await cloudSaveNow();
    }
    saveLocal();
    unlock();
    if(window.PublicKeyCredential && localStorage.getItem('moneymika_bio_enabled')!=='1'){
      setTimeout(()=>{
        if(confirm("Activer Face ID / empreinte pour te connecter plus vite la prochaine fois ?")){
          setupBiometric(email, password);
        }
      }, 500);
    }
  }catch(err){
    document.getElementById('lockForm').style.display='block';
    spinner.style.display='none';
    msg.textContent = "Erreur : " + (err.message || "connexion impossible.");
  }
}

async function setupBiometric(email, password){
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: "Money Mika" },
        user: { id: userId, name: email, displayName: email },
        pubKeyCredParams: [{type:"public-key", alg:-7},{type:"public-key", alg:-257}],
        authenticatorSelection: { residentKey:"required", userVerification:"required", authenticatorAttachment:"platform" },
        timeout: 60000
      }
    });
    if(cred){
      localStorage.setItem('moneymika_bio_email', email);
      localStorage.setItem('moneymika_bio_pw', btoa(unescape(encodeURIComponent(password))));
      localStorage.setItem('moneymika_bio_enabled','1');
      alert("Face ID / empreinte activé.");
    }
  }catch(e){
    alert("Échec activation : "+e.message);
  }
}
async function unlockWithBiometric(){
  const msg = document.getElementById('lockMsg');
  msg.textContent = "";
  try{
    await navigator.credentials.get({
      publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), userVerification:"required", timeout:60000 }
    });
    const email = localStorage.getItem('moneymika_bio_email');
    const pwB64 = localStorage.getItem('moneymika_bio_pw');
    if(!email||!pwB64){ msg.textContent="Aucune configuration biométrique sur cet appareil."; return; }
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = decodeURIComponent(escape(atob(pwB64)));
    await doLogin();
  }catch(e){
    msg.textContent = "Face ID / empreinte annulé.";
  }
}
function disableBiometric(){
  localStorage.removeItem('moneymika_bio_enabled');
  localStorage.removeItem('moneymika_bio_email');
  localStorage.removeItem('moneymika_bio_pw');
  alert("Face ID / empreinte désactivé sur cet appareil.");
}

async function cloudSaveNow(){
  if(!currentKey || !currentUid) return;
  try{
    const enc = await encryptData(currentKey, DATA);
    await db.collection('users').doc(currentUid).set({
      salt: currentSaltB64, iv: enc.iv, data: enc.data,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ console.error("Sync cloud échouée :", e); }
}
function scheduleCloudSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(cloudSaveNow, 1200);
}
function unlock(){
  document.getElementById('lock').style.display="none";
  document.getElementById('app').style.display="flex";
  materializeUpToCurrent();
  render();
  if(window.__pendingDriveAction){
    const action = window.__pendingDriveAction;
    window.__pendingDriveAction = null;
    VIEW = 'io';
    render();
    setTimeout(()=>{
      const token = sessionStorage.getItem('gdrive_token');
      const msg = document.getElementById('driveMsg');
      if(!token) return;
      if(action==='restore') restoreLatestFromDrive(token, msg);
      else uploadJSONToDrive(token, msg);
    }, 300);
  }
}
function materializeUpToCurrent(){
  let target = currentMonth;
  let earliest = target;
  DATA.recurring.forEach(r=>{ if(r.startDate && r.startDate.slice(0,7) < earliest) earliest = r.startDate.slice(0,7); });
  Object.keys(DATA.cardManualTotal||{}).forEach(mk=>{ if(mk < earliest) earliest = mk; });
  Object.keys(DATA.cardExtras||{}).forEach(mk=>{ if(mk < earliest) earliest = mk; });
  Object.keys(DATA.cardDefer||{}).forEach(mk=>{ if(mk < earliest) earliest = mk; });
  let cursor = earliest, guard = 0;
  while(cursor <= target && guard < 60){
    ensureRecurringMaterialized(cursor);
    cursor = shiftMonth(cursor, 1);
    guard++;
  }
}

// ---------- DONNEES LOCALES (cache hors-ligne, en clair sur CET appareil uniquement) ----------
const LOCAL_KEY = "moneymika_local_cache";
let DATA = loadLocal() || {
  accounts:[{id:1,name:"Compte courant",balance:0}],
  categories:["Salaire","Loyer","Courses","Transport","Loisirs","Santé","Autre"],
  transactions:[], recurring:[], cardDefer:{}, cardExtras:{}, cardManualTotal:{}, recurringOverrides:{}, categoryIcons:{}, cardExtraValidated:{},
  nextTxId:1, nextAccId:2, nextRecId:1, nextCardExtraId:1
};
if(!DATA.cardDefer) DATA.cardDefer={};
if(!DATA.cardExtras) DATA.cardExtras={};
if(!DATA.cardManualTotal) DATA.cardManualTotal={};
if(!DATA.recurringOverrides) DATA.recurringOverrides={};
if(!DATA.categoryIcons) DATA.categoryIcons={};
if(!DATA.cardExtraValidated) DATA.cardExtraValidated={};
if(!DATA.nextCardExtraId) DATA.nextCardExtraId=1;
function saveLocal(){ localStorage.setItem(LOCAL_KEY, JSON.stringify(DATA)); }
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)); }catch(e){ return null; } }
function save(){ saveLocal(); scheduleCloudSave(); }

let VIEW="dash";
let currentMonth = todayStr().slice(0,7);
let cardModalMonth = todayStr().slice(0,7);

// ---------- HELPERS ----------
function fmt(n){ return (n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
function todayStr(){ let d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function accName(id){ return DATA.accounts.find(a=>a.id==id)?.name || "?"; }
function computeBalance(accId){
  let bal = DATA.accounts.find(a=>a.id==accId)?.balance||0;
  DATA.transactions.filter(t=>t.accountId==accId).forEach(t=>{ bal += t.type==='in'?t.amount:-t.amount; });
  return bal;
}
function totalBalance(){
  let bal = balanceBeforeMonth(currentMonth);
  DATA.transactions.forEach(t=>{
    if(t.date.slice(0,7)===currentMonth) bal += (t.type==='in'?t.amount:-t.amount);
  });
  return bal;
}
function monthLabel(mk){ let [y,m]=mk.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); }
function shiftMonth(mk,delta){ let [y,m]=mk.split('-').map(Number); let d=new Date(y,m-1+delta,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function nextMonthKey(mk){ return shiftMonth(mk,1); }
function recurringActiveInMonth(r, mk){
  if(r.startDate && mk < r.startDate.slice(0,7)) return false;
  if(r.endDate && mk > r.endDate.slice(0,7)) return false;
  return true;
}
// Montant réel à utiliser pour une récurrente sur un mois précis : le montant de base,
// sauf si un montant spécifique à ce mois a été saisi (n'affecte pas les autres mois).
function recurringEffectiveAmount(r, mk){
  if(DATA.recurringOverrides[mk] && DATA.recurringOverrides[mk][r.id]!==undefined) return DATA.recurringOverrides[mk][r.id];
  return r.amount;
}
// Total de la carte pour un mois : si un montant a été saisi manuellement, il fait foi
// (les récurrentes cochées et les ponctuels ne s'additionnent plus dessus, pour éviter les doublons).
// Sinon, calcul automatique = récurrentes carte cochées + achats ponctuels.
function cardAutoTotal(mk){
  let validated = DATA.cardDefer[mk] || [];
  let carte = DATA.recurring.filter(r=>r.type==='out' && r.paymentMethod==='carte' && recurringActiveInMonth(r,mk));
  let sum = carte.filter(r=>validated.includes(r.id)).reduce((s,r)=>s+recurringEffectiveAmount(r,mk),0);
  let extraValidated = DATA.cardExtraValidated[mk] || [];
  let extras = DATA.cardExtras[mk] || [];
  sum += extras.filter(e=>extraValidated.includes(e.id)).reduce((s,e)=>s+e.amount,0);
  return sum;
}
function cardTotalForMonth(mk){
  let manual = DATA.cardManualTotal[mk];
  if(manual!==undefined && manual!==null && manual!=='') return parseFloat(manual);
  return cardAutoTotal(mk);
}
function recurringForMonth(mk){
  let inSum=0, outSum=0;
  DATA.recurring.forEach(r=>{
    if(!recurringActiveInMonth(r,mk)) return;
    if(r.type==='in'){ inSum += recurringEffectiveAmount(r,mk); return; }
    if(r.paymentMethod!=='carte'){ outSum += recurringEffectiveAmount(r,mk); }
  });
  let extras = DATA.cardExtras[mk] || [];
  outSum += extras.reduce((s,e)=>s+e.amount,0);
  outSum += cardTotalForMonth(mk);
  return {inSum, outSum};
}

// Transforme les récurrentes RIB (auto) et le total carte du mois en VRAIS mouvements,
// pour qu'ils comptent dans Entrées/Sorties/Net réel et le solde. Sans doublon : un seul
// mouvement par récurrente et par mois (identifié par sourceRecId), mis à jour si le montant change.
// Nettoie aussi les vieux mouvements si la récurrente n'est plus active ce mois (date changée).
function ensureRecurringMaterialized(mk){
  let changed = false;
  let validated = DATA.cardDefer[mk] || [];
  DATA.recurring.forEach(r=>{
    let active = recurringActiveInMonth(r,mk);
    let isCarte = (r.type==='out' && r.paymentMethod==='carte');
    let checked = isCarte && validated.includes(r.id);
    let shouldExist = active && !checked;
    let existing = DATA.transactions.find(t=>t.sourceRecId===r.id && t.date.slice(0,7)===mk);
    if(!shouldExist){
      // pas (ou plus) active ce mois, ou repliée dans le relevé : supprime le vieux mouvement s'il existe
      if(existing){ DATA.transactions.splice(DATA.transactions.indexOf(existing),1); changed=true; }
      return;
    }
    let effAmount = recurringEffectiveAmount(r,mk);
    let dateVal = mk+'-'+String(Math.min(r.dayOfMonth||1,28)).padStart(2,'0');
    if(!existing){
      DATA.transactions.push({id:DATA.nextTxId++, date:dateVal, accountId:r.accountId, type:r.type, category:r.category, amount:effAmount, note:r.label+(isCarte?' (Carte)':' (RIB)'), sourceRecId:r.id});
      changed = true;
    } else if(existing.amount!==effAmount || existing.category!==r.category || existing.accountId!==r.accountId){
      existing.amount=effAmount; existing.category=r.category; existing.accountId=r.accountId;
      changed = true;
    }
  });
  // Achats ponctuels carte : non validés = mouvement individuel (compte comme une dépense normale),
  // validés = repliés dans le relevé carte (comme les récurrentes cochées)
  let extraValidatedSet = DATA.cardExtraValidated[mk] || [];
  let extras = DATA.cardExtras[mk] || [];
  extras.forEach(e=>{
    let isValidated = extraValidatedSet.includes(e.id);
    let existing = DATA.transactions.find(t=>t.sourceCardExtraId===e.id && t.date.slice(0,7)===mk);
    if(isValidated){
      if(existing){ DATA.transactions.splice(DATA.transactions.indexOf(existing),1); changed=true; }
      return;
    }
    let dateVal = mk+'-'+String(e.day||15).padStart(2,'0');
    let acc = e.accountId || DATA.accounts[0]?.id;
    let cat = e.category || 'Carte';
    if(!existing){
      DATA.transactions.push({id:DATA.nextTxId++, date:dateVal, accountId:acc, type:'out', category:cat, amount:e.amount, note:e.label+' (carte, non validé)', sourceCardExtraId:e.id});
      changed = true;
    } else if(existing.amount!==e.amount || existing.category!==cat || existing.accountId!==acc){
      existing.amount = e.amount; existing.category = cat; existing.accountId = acc;
      changed = true;
    }
  });
  // supprime mouvements de ponctuels effacés
  let extraIds = extras.map(e=>e.id);
  let beforeLen = DATA.transactions.length;
  DATA.transactions = DATA.transactions.filter(t=>!(t.sourceCardExtraId && t.date.slice(0,7)===mk && !extraIds.includes(t.sourceCardExtraId)));
  if(DATA.transactions.length!==beforeLen) changed=true;
  // Relevé carte du mois = un seul mouvement représentant le total (manuel, ou somme des cochées)
  let total = cardTotalForMonth(mk);
  let cardTx = DATA.transactions.find(t=>t.sourceCardStatement===true && t.date.slice(0,7)===mk);
  let defaultAccId = DATA.accounts[0]?.id;
  if(total>0){
    let dateVal = mk+'-28';
    if(!cardTx){
      DATA.transactions.push({id:DATA.nextTxId++, date:dateVal, accountId:defaultAccId, type:'out', category:'Carte', amount:total, note:'Relevé carte différée', sourceCardStatement:true});
      changed = true;
    } else if(cardTx.amount!==total){
      cardTx.amount = total;
      changed = true;
    }
  } else if(cardTx){
    DATA.transactions = DATA.transactions.filter(t=>t!==cardTx);
    changed = true;
  }
  if(changed) save();
}

  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.v===VIEW));

  if(VIEW==='dash') c.innerHTML=renderDash();
  if(VIEW==='tx') c.innerHTML=renderTx();
  if(VIEW==='rec') c.innerHTML=renderRec();
  if(VIEW==='previs') c.innerHTML=renderPrevis();
  if(VIEW==='io') c.innerHTML=renderIO();
  attachDrop();
}
(function setupSwipeMonth(){
  let startX=0, startY=0, tracking=false;
  document.addEventListener('touchstart', e=>{
    if(VIEW!=='dash') return;
    tracking=true;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!tracking) return;
    tracking=false;
    if(VIEW!=='dash') return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx)>70 && Math.abs(dy)<60){
      changeMonth(dx<0 ? 1 : -1);
    }
  }, {passive:true});
})();
function balanceBeforeMonth(mk){
  let bal = DATA.accounts.reduce((s,a)=>s+(a.balance||0),0);
  let firstDay = mk+'-01';
  DATA.transactions.forEach(t=>{ if(t.date < firstDay) bal += (t.type==='in'?t.amount:-t.amount); });
  return bal;
}

    </div>

      <span class="small">Carte du mois</span>
      <span class="num neg">-${fmt(validatedAmount)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);">
      <span class="small">Mouvements du mois</span>
      <span class="num neg">-${fmt(mvtSum)}</span>

// ---------- DETECTEUR DE RECURRENCES ----------
function detectRecurringCandidates(){
  let map = {};
  DATA.transactions.forEach(t=>{
    let key = t.type+'|'+t.category+'|'+t.amount.toFixed(2)+'|'+(t.note||'').toLowerCase().trim();
    if(!map[key]) map[key] = {type:t.type, category:t.category, amount:t.amount, note:t.note, months:new Set(), days:[]};
    map[key].months.add(t.date.slice(0,7));
    map[key].days.push(parseInt(t.date.slice(8,10)));
  });
  let existing = new Set(DATA.recurring.map(r=>r.type+'|'+r.category+'|'+r.amount.toFixed(2)+'|'+(r.label||'').toLowerCase().trim()));
  return Object.values(map)
    .filter(v=>v.months.size>=3)
    .filter(v=>!existing.has(v.type+'|'+v.category+'|'+v.amount.toFixed(2)+'|'+(v.note||'').toLowerCase().trim()))
    .map(v=>({...v, dayOfMonth: Math.round(v.days.reduce((s,d)=>s+d,0)/v.days.length)}))
    .sort((a,b)=>b.months.size-a.months.size);
}
let recCandidates = [];
let recSelected = new Set();
function openRecurringDetector(){
  recCandidates = detectRecurringCandidates();
  recSelected = new Set(recCandidates.map((_,i)=>i));
  const overlay=document.getElementById('recDetectOverlay'), sheet=document.getElementById('recDetectSheet');
  overlay.style.cssText="position:fixed;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:85;";
  sheet.style.cssText="display:block;width:100%;max-width:480px;background:var(--panel);border-radius:24px 24px 0 0;padding:22px 18px 28px;border:1px solid var(--line);border-bottom:none;max-height:80vh;overflow-y:auto;";
  renderRecDetectSheet();
}
function closeRecurringDetector(){ document.getElementById('recDetectOverlay').style.display='none'; }
function renderRecDetectSheet(){
  document.getElementById('recDetectSheet').innerHTML = `
    <div class="handle"></div>
    <h3 class="blocktitle">Récurrences détectées</h3>
    <h2 class="pagehead" style="margin-bottom:10px;">${recCandidates.length} trouvée(s)</h2>
    ${recCandidates.length===0 ? '<div class="small">Rien de nouveau à proposer.</div>' : recCandidates.map((c,i)=>{
      let on = recSelected.has(i);
      return `<div class="list-item"><div><div class="item-main">${c.note || c.category}</div>
        <div class="item-sub">${c.category} · vu ${c.months.size} mois · le ${c.dayOfMonth}</div></div>

        <span class="num ${c.type==='in'?'pos':'neg'}">${c.type==='in'?'+':'-'}${fmt(c.amount)}</span>

    }).join('')}
    ${recCandidates.length>0 ? `<button class="btn primary" style="margin-top:16px;" onclick="confirmRecCandidates()">Ajouter les cochées</button>` : ''}
    <button class="btn ghost" style="margin-top:8px;" onclick="closeRecurringDetector()">Fermer</button>`;
}
function toggleRecCandidate(i){ if(recSelected.has(i)) recSelected.delete(i); else recSelected.add(i); renderRecDetectSheet(); }
function confirmRecCandidates(){
  let defaultAccId = DATA.accounts[0]?.id;
  recCandidates.forEach((c,i)=>{
    if(!recSelected.has(i)) return;
    DATA.recurring.push({id:DATA.nextRecId++, label:c.note||c.category, type:c.type, accountId:defaultAccId, category:c.category, amount:c.amount, dayOfMonth:c.dayOfMonth, paymentMethod: c.type==='out' ? 'rib' : null});
  });
  save();
  closeRecurringDetector();
  render();
}

    ${list.map(t=>`<div class="rec-card" style="margin-bottom:8px;padding:12px;"><div class="rec-icon ${t.type==='in'?'in':'out'}" style="width:44px;height:44px;font-size:20px;">${iconHTML(categoryIcon(t.category))}</div><div class="rec-body"><div class="rec-title" style="font-size:15.5px;">${escapeHtml(t.category)}</div><div class="rec-sub">${t.note?escapeHtml(t.note.replace(/ \((RIB|Carte)\)$/,''))+' · ':''}${t.date}</div></div><div style="display:flex;align-items:center;gap:8px;"><span class="num ${t.type==='in'?'pos':'neg'}" style="font-size:15.5px;">${t.type==='in'?'+':'-'}${fmt(t.amount)}</span><button class="btn ghost" style="width:auto;padding:6px 9px;" onclick="editTx(${t.id})">✎</button><button class="btn danger" style="width:auto;padding:6px 9px;" onclick="delTx(${t.id})">✕</button></div></div>`).join('') || '<div class="small">Aucun mouvement. Utilise le bouton + en bas.</div>'}

    let mk = i===0 ? currentMonth : (cursor.setMonth(cursor.getMonth()+1), cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0'));

// Verrouillage automatique après 10 minutes sans activité
(function autoLock(){
  const DELAY = 10*60*1000;
  let timer = null;
  function reset(){
    clearTimeout(timer);
    if(!currentUid) return;
    timer = setTimeout(()=>{
      if(currentUid) doLogout();
    }, DELAY);
  }
  ['touchstart','click','keydown','scroll'].forEach(ev=>{
    document.addEventListener(ev, reset, {passive:true});
  });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reset(); });
  setInterval(reset, 60*1000);
})();

function toggleDefer(recId){
  if(!DATA.cardDefer[cardModalMonth]) DATA.cardDefer[cardModalMonth]=[];

// ---------- ACTIONS ----------
function addAccount(){
  let name=document.getElementById('accName').value.trim();
  let bal=parseFloat(document.getElementById('accBal').value)||0;
  if(!name) return alert("Nom du compte requis.");
  DATA.accounts.push({id:DATA.nextAccId++,name,balance:bal}); save(); render();
}
function delTx(id){ DATA.transactions=DATA.transactions.filter(t=>t.id!==id); save(); render(); }
function editTx(id){
  let t = DATA.transactions.find(x=>x.id===id);
  if(!t) return;
  let val = prompt('Nouveau montant pour "'+(t.category||'')+'" du '+t.date+' (ce mouvement seulement) :', t.amount);
  if(val===null) return;
  let amount = parseFloat(String(val).replace(',','.'));
  if(isNaN(amount)||amount<=0) return alert("Montant invalide.");
  if(t.sourceRecId){
    // vient d'une récurrente : enregistre comme montant spécifique à ce mois,
    // sinon la régénération automatique écraserait la modification
    let mk = t.date.slice(0,7);
    if(!DATA.recurringOverrides[mk]) DATA.recurringOverrides[mk] = {};
    DATA.recurringOverrides[mk][t.sourceRecId] = amount;
  }
  if(t.sourceCardStatement){
    let mk = t.date.slice(0,7);
    DATA.cardManualTotal[mk] = amount;
  }
  t.amount = amount;
  save();
  ensureRecurringMaterialized(t.date.slice(0,7));
  render();
}
let editingRecId = null;

  document.getElementById('recEnd').value = r.endDate || '';
  setRecPayment(r.paymentMethod || 'rib');

  document.getElementById('recSubmitBtn').textContent = 'Enregistrer les modifications';
  document.getElementById('recCancelBtn').style.display = 'block';
  window.scrollTo(0,0);
  document.getElementById('content').scrollTop = 0;
}
function cancelEditRec(){
  editingRecId = null;
  render();
}
function addRec(){
  let label=document.getElementById('recLabel').value.trim();
  let type=document.getElementById('recType').value;
  let accountId=parseInt(document.getElementById('recAcc').value);
  let category=document.getElementById('recCat').value;
  let amount=parseFloat(document.getElementById('recAmount').value);
  let dayOfMonth=parseInt(document.getElementById('recDay').value)||1;
  let startDate=document.getElementById('recStart').value || null;
  let endDate=document.getElementById('recEnd').value || null;
  let paymentMethod = type==='out' ? (window.__recPayment||'rib') : null;
  let icon = window.__recIcon || null;
  if(!label||!amount) return alert("Nom et montant requis.");
  if(editingRecId){
    let r = DATA.recurring.find(x=>x.id===editingRecId);
    if(r){ Object.assign(r,{label,type,accountId,category,amount,dayOfMonth,startDate,endDate,paymentMethod,icon}); }
    editingRecId = null;
  } else {
    DATA.recurring.push({id:DATA.nextRecId++,label,type,accountId,category,amount,dayOfMonth,startDate,endDate,paymentMethod,icon});
  }
  save();
  ensureRecurringMaterialized(currentMonth);
  render();
  window.__recPayment='rib';
  window.__recIcon=null;
}
function delRec(id){
  let r = DATA.recurring.find(x=>x.id===id);
  let nom = r ? r.label : "cette récurrente";
  if(!confirm('Supprimer "'+nom+'" ? Elle ne se reproduira plus les mois suivants. Cette action est définitive.')) return;
  DATA.recurring=DATA.recurring.filter(x=>x.id!==id);
  Object.keys(DATA.cardDefer).forEach(mk=>{ DATA.cardDefer[mk]=DATA.cardDefer[mk].filter(rid=>rid!==id); });
  Object.keys(DATA.recurringOverrides).forEach(mk=>{ delete DATA.recurringOverrides[mk][id]; });
  DATA.transactions = DATA.transactions.filter(t=>t.sourceRecId!==id);
  save();
  ensureRecurringMaterialized(currentMonth);
  render();
}
function overrideRecurringMonth(id){
  let r = DATA.recurring.find(x=>x.id===id);
  if(!r) return;
  let current = recurringEffectiveAmount(r, currentMonth);
  let val = prompt('Nouveau montant pour "'+r.label+'" — uniquement pour '+monthLabel(currentMonth)+'. Les autres mois ne changent pas.', current);
  if(val===null) return;
  let amount = parseFloat(String(val).replace(',','.'));
  if(isNaN(amount)) return alert("Montant invalide.");
  if(!DATA.recurringOverrides[currentMonth]) DATA.recurringOverrides[currentMonth] = {};
  DATA.recurringOverrides[currentMonth][id] = amount;
  save();
  ensureRecurringMaterialized(currentMonth);
  render();
}

// ===== SAUVEGARDE MANUELLE GOOGLE DRIVE (par redirection, marche en mode appli) =====
const GOOGLE_DRIVE_CLIENT_ID = "964719076221-em8ds3m44vbi195bpp95khneeto7ljj5.apps.googleusercontent.com";
function driveRedirectUri(){ return "https://moneymika.vercel.app"; }
function backupToDrive(){
  const msg = document.getElementById('driveMsg');
  if(GOOGLE_DRIVE_CLIENT_ID.includes("REMPLACE_MOI")){
    msg.textContent = "Configuration Google Drive manquante (Client ID à renseigner).";
    return;
  }
  const cached = sessionStorage.getItem('gdrive_token');
  if(cached){ uploadJSONToDrive(cached, msg); return; }
  goToGoogleDrive(msg, 'moneymika_drive');
}
function restoreFromDrive(){
  const msg = document.getElementById('driveMsg');
  if(GOOGLE_DRIVE_CLIENT_ID.includes("REMPLACE_MOI")){
    msg.textContent = "Configuration Google Drive manquante (Client ID à renseigner).";
    return;
  }
  const cached = sessionStorage.getItem('gdrive_token');
  if(cached){ restoreLatestFromDrive(cached, msg); return; }
  goToGoogleDrive(msg, 'moneymika_drive_restore');
}
function goToGoogleDrive(msg, state){
  msg.textContent = "Redirection vers Google...";
  const redirectUri = encodeURIComponent(driveRedirectUri());
  const scope = encodeURIComponent('https://www.googleapis.com/auth/drive.file');
  const url = "https://accounts.google.com/o/oauth2/v2/auth?client_id="+GOOGLE_DRIVE_CLIENT_ID+
    "&redirect_uri="+redirectUri+"&response_type=token&scope="+scope+
    "&include_granted_scopes=true&prompt=consent&state="+state;
  window.location.href = url;
}
function checkDriveRedirect(){
  if(window.location.hash.includes('access_token')){
    const params = new URLSearchParams(window.location.hash.substring(1));
    const token = params.get('access_token');
    const state = params.get('state');
    history.replaceState(null,'',window.location.pathname);
    if(token && (state==='moneymika_drive' || state==='moneymika_drive_restore')){
      sessionStorage.setItem('gdrive_token', token);
      window.__pendingDriveAction = (state==='moneymika_drive_restore') ? 'restore' : 'backup';
    }
  }
}
checkDriveRedirect();
async function uploadJSONToDrive(accessToken, msg){
  try{
    if(msg) msg.textContent = "Envoi vers Drive...";
    const today = todayStr();
    const fileName = "moneymika-sauvegarde-"+today+".json";
    const content = JSON.stringify(DATA, null, 2);
    const boundary = "moneymika_boundary";
    const metadata = { name: fileName, mimeType: "application/json" };
    const body =
      "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(metadata)+"\r\n"+
      "--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+content+"\r\n"+
      "--"+boundary+"--";
    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: { Authorization: "Bearer "+accessToken, "Content-Type": "multipart/related; boundary="+boundary },
      body
    });
    if(res.status===401){
      sessionStorage.removeItem('gdrive_token');
      if(msg) msg.textContent = "Session expirée, reclique pour te reconnecter.";
      return;
    }
    if(!res.ok) throw new Error("Échec envoi ("+res.status+")");
    if(msg) msg.textContent = "✓ Sauvegardé sur Drive : "+fileName;
  }catch(e){
    if(msg) msg.textContent = "Erreur : "+e.message;
  }
}
async function restoreLatestFromDrive(accessToken, msg){
  try{
    if(msg) msg.textContent = "Recherche de la dernière sauvegarde...";
    const q = encodeURIComponent("name contains 'moneymika-sauvegarde' and trashed=false");
    const listUrl = "https://www.googleapis.com/drive/v3/files?q="+q+"&orderBy=createdTime desc&pageSize=1&fields=files(id,name,createdTime)";
    const listRes = await fetch(listUrl, { headers: { Authorization: "Bearer "+accessToken } });
    if(listRes.status===401){
      sessionStorage.removeItem('gdrive_token');
      if(msg) msg.textContent = "Session expirée, reclique pour te reconnecter.";
      return;
    }
    if(!listRes.ok) throw new Error("Échec recherche ("+listRes.status+")");
    const listData = await listRes.json();
    if(!listData.files || listData.files.length===0){
      if(msg) msg.textContent = "Aucune sauvegarde trouvée sur Drive.";
      return;
    }
    const file = listData.files[0];
    if(!confirm('Restaurer "'+file.name+'" ? Toutes les données actuelles seront remplacées.')) {
      if(msg) msg.textContent = "Annulé.";
      return;
    }
    if(msg) msg.textContent = "Téléchargement de "+file.name+"...";
    const fileRes = await fetch("https://www.googleapis.com/drive/v3/files/"+file.id+"?alt=media", {
      headers: { Authorization: "Bearer "+accessToken }
    });
    if(!fileRes.ok) throw new Error("Échec téléchargement ("+fileRes.status+")");
    const obj = await fileRes.json();
    if(!obj.transactions || !obj.accounts) throw new Error("Fichier invalide.");
    DATA = obj;
    if(!DATA.recurring) DATA.recurring=[];
    if(!DATA.cardDefer) DATA.cardDefer={};
    if(!DATA.cardExtras) DATA.cardExtras={};
    if(!DATA.cardManualTotal) DATA.cardManualTotal={};
    if(!DATA.recurringOverrides) DATA.recurringOverrides={};
    if(!DATA.categoryIcons) DATA.categoryIcons={};
    if(!DATA.cardExtraValidated) DATA.cardExtraValidated={};
    if(!DATA.nextCardExtraId) DATA.nextCardExtraId=1;
    save();
    materializeUpToCurrent();
    render();
    if(msg) msg.textContent = "✓ Restauré depuis Drive : "+file.name;
  }catch(e){
    if(msg) msg.textContent = "Erreur : "+e.message;
  }
}

function exportCSV(){
  let rows=[["date","compte","type","categorie","montant","note"]];
  DATA.transactions.forEach(t=>rows.push([t.date,accName(t.accountId),t.type,t.category,t.amount,t.note||'']));
  let csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  let blob=new Blob([csv],{type:"text/csv"});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download="moneymika-mouvements-"+todayStr()+".csv"; a.click();
}
function cleanStartFrom(){
  let cutoff = document.getElementById('cleanStartDate').value;
  if(!cutoff) return alert("Choisis une date.");
  if(!confirm("Tous les mouvements avant le "+cutoff+" seront supprimés définitivement, et le solde sera recalculé à cette date. Continuer ?")) return;
  DATA.accounts.forEach(acc=>{
    let bal = acc.balance||0;
    DATA.transactions.forEach(t=>{
      if(t.accountId===acc.id && t.date < cutoff){ bal += (t.type==='in'?t.amount:-t.amount); }
    });
    acc.balance = bal;
  });
  DATA.transactions = DATA.transactions.filter(t=>t.date >= cutoff);
  save();
  render();
  alert("Fait. Nouveau départ au "+cutoff+", soldes recalculés.");
}
function changeCategoryIcon(cat){
  let val = prompt('Icône pour "'+cat+'" : colle un emoji, ou un lien d\'image (https://...)', DATA.categoryIcons[cat]||'');
  if(val===null) return;
  val = val.trim();
  if(val==='') delete DATA.categoryIcons[cat];
  else DATA.categoryIcons[cat] = val;

function renameCategory(oldName){
  let neu = prompt('Nouveau nom pour "'+oldName+'" :', oldName);
  if(!neu) return;
  neu = neu.trim();
  if(!neu || neu===oldName) return;
  if(DATA.categories.includes(neu)) return alert("Cette catégorie existe déjà.");
  let idx = DATA.categories.indexOf(oldName);
  if(idx>-1) DATA.categories[idx] = neu;
  DATA.transactions.forEach(t=>{ if(t.category===oldName) t.category=neu; });
  DATA.recurring.forEach(r=>{ if(r.category===oldName) r.category=neu; });
  save(); render();
}

function importFile(file){
  const msg=document.getElementById('importMsg');
  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result;
    try{
      if(file.name.endsWith('.json')){
        const obj=JSON.parse(text);
        if(obj.transactions && obj.accounts){ DATA=obj; if(!DATA.recurring) DATA.recurring=[]; if(!DATA.cardDefer) DATA.cardDefer={}; if(!DATA.cardExtras) DATA.cardExtras={}; if(!DATA.cardManualTotal) DATA.cardManualTotal={}; if(!DATA.recurringOverrides) DATA.recurringOverrides={}; if(!DATA.categoryIcons) DATA.categoryIcons={}; if(!DATA.cardExtraValidated) DATA.cardExtraValidated={}; if(!DATA.nextCardExtraId) DATA.nextCardExtraId=1; save(); msg.textContent="Sauvegarde chargée : "+DATA.transactions.length+" mouvements."; }
        else msg.textContent="Fichier JSON non reconnu.";
      } else importCSVGeneric(text,msg);
      render();
    }catch(err){ msg.textContent="Erreur : "+err.message; }
  };
  reader.readAsText(file);
}
function stripAccents(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function importCSVGeneric(text,msg){
  let lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length){ msg.textContent="Fichier vide."; return; }
  let delim=lines[0].includes(';')?';':',';
  let headers=splitCSVLine(lines[0],delim).map(h=>stripAccents(h.trim().toLowerCase()));
  let noteIdxRemarque=headers.findIndex(h=>h.includes('remarque'));
  let noteIdxGroupe=headers.findIndex(h=>h.includes('groupe'));
  let noteIdxGeneric=headers.findIndex(h=>h.includes('note')||h.includes('memo')||h.includes('desc'));
  let idx={date:headers.findIndex(h=>h.includes('date')),amount:headers.findIndex(h=>h.includes('amount')||h.includes('montant')),category:headers.findIndex(h=>h.includes('categ')),note:noteIdxRemarque>-1?noteIdxRemarque:(noteIdxGeneric>-1?noteIdxGeneric:noteIdxGroupe),noteAlt:noteIdxRemarque>-1?noteIdxGroupe:-1,account:headers.findIndex(h=>h.includes('account')||(h.includes('compte')&&!h.includes('contrepartie'))),type:headers.findIndex(h=>h.includes('type'))};
  if(idx.date===-1||idx.amount===-1){ msg.textContent="Colonnes date/montant introuvables. Colonnes : "+headers.join(', '); return; }
  let defaultAcc=DATA.accounts[0]; if(!defaultAcc){ defaultAcc={id:1,name:"Compte importé",balance:0}; DATA.accounts.push(defaultAcc); }
  let existingKeys = new Set(DATA.transactions.map(t=>t.date+'|'+t.type+'|'+t.amount.toFixed(2)+'|'+(t.note||'').trim().toLowerCase()));
  let count=0, skipped=0;
  for(let i=1;i<lines.length;i++){
    let cols=splitCSVLine(lines[i],delim); if(cols.length<2) continue;
    let raw=(cols[idx.amount]||'0').replace(/[^\d,.\-]/g,'').replace(',','.');
    let amount=parseFloat(raw); if(isNaN(amount)) continue;
    let type=amount<0?'out':'in';
    if(idx.type>-1 && cols[idx.type]){ let tv=stripAccents(cols[idx.type].toLowerCase()); if(tv.includes('exp')||tv.includes('depens')||tv.includes('debit')) type='out'; if(tv.includes('inc')||tv.includes('revenu')||tv.includes('credit')) type='in'; }
    let acc=defaultAcc.id;
    if(idx.account>-1 && cols[idx.account]){ let nm=cols[idx.account].trim(); let found=DATA.accounts.find(a=>a.name===nm); if(!found){ found={id:DATA.nextAccId++,name:nm,balance:0}; DATA.accounts.push(found); } acc=found.id; }
    let noteVal = idx.note>-1?(cols[idx.note]||'').trim():'';
    if(!noteVal && idx.noteAlt>-1) noteVal = (cols[idx.noteAlt]||'').trim();
    let dateVal = normalizeDate(cols[idx.date]);
    let dedupeKey = dateVal+'|'+type+'|'+Math.abs(amount).toFixed(2)+'|'+noteVal.trim().toLowerCase();
    if(existingKeys.has(dedupeKey)){ skipped++; continue; }
    existingKeys.add(dedupeKey);
    DATA.transactions.push({id:DATA.nextTxId++,date:dateVal,accountId:acc,type,category:idx.category>-1&&cols[idx.category]?cols[idx.category]:'Autre',amount:Math.abs(amount),note:noteVal});
    count++;
  }
  save();
  msg.textContent=count+" mouvements importés"+(skipped>0?(", "+skipped+" doublons évités"):"")+".";
}
function splitCSVLine(line,delim){
  let out=[],cur='',inQ=false;
  for(let i=0;i<line.length;i++){ let c=line[i]; if(c==='"'){inQ=!inQ;continue;} if(c===delim&&!inQ){out.push(cur);cur='';continue;} cur+=c; }
  out.push(cur); return out;
}
function normalizeDate(d){
  if(!d) return todayStr(); d=d.trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0,10);
  let m=d.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){ let a=parseInt(m[1]),b=parseInt(m[2]),y=m[3].length===2?'20'+m[3]:m[3]; let day=a,month=b; if(a>12){day=a;month=b;} else if(b>12){day=b;month=a;} return `${y}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`; }
  return todayStr();
}
